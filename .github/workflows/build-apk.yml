name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # start a build by hand from the Actions tab (works on a phone too)

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Optional signing secrets. Without them the release build is signed with the debug
    # key (see app/build.gradle.kts). Secrets are exposed to `if:` through the env context.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # android-actions/setup-android@v3 still installs the "tools" package, which no longer
      # exists in the SDK repository ("Failed to find package 'tools'"). The runners already
      # ship the command-line tools, so install what compileSdk 35 needs directly.
      - name: Install the Android SDK packages
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -n1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      # Installs Gradle 8.9 itself and caches dependencies between runs. This repo has no
      # gradlew / wrapper jar, so the build calls `gradle` directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # WheelEngineTest and AudioHeadersTest run on the JVM: fast, no emulator.
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Decode the signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hifi-launcher-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: hifi-launcher-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
